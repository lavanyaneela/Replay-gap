name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite runs as its own job across three Pythons, with no optional extras installed.
  # Installing without the extras is deliberate: a heavy optional dependency present on one
  # machine masks a broken import everywhere it is installed, and the job that would have
  # caught it is the one that installs without it.
  tests:
    name: tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install the package and its development extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests tools experiments
          ruff format --check src tests tools experiments

      - name: Tests
        run: |
          mkdir -p reports
          python -m pytest -q \
            --junitxml=reports/junit.xml \
            --cov=replay_gap \
            --cov-report=json:reports/coverage.json \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing

      - name: Coverage floor
        run: |
          python - <<'PY'
          import json
          import sys

          FLOOR = 95.0
          with open("reports/coverage.json", encoding="utf-8") as handle:
              covered = json.load(handle)["totals"]["percent_covered"]
          print(f"line coverage {covered:.2f}%, floor {FLOOR}%")
          if covered < FLOOR:
              sys.exit(f"coverage {covered:.2f}% is below the {FLOOR}% floor")
          PY

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-py${{ matrix.python }}
          path: reports/
          retention-days: 14

  # The receipts job re-measures every published figure from scratch and fails if a document
  # quotes one the code no longer produces. It calls the collector with --skip-tests and reads
  # the reports from its own pytest step, because a red test surfacing as a CalledProcessError
  # traceback from inside a metrics script costs an hour to attribute.
  receipts:
    name: receipts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package and its development extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Regenerate the committed fixture and confirm it matches
        run: |
          python - <<'PY'
          from replay_gap.config import load_config
          from replay_gap.fixtures import build_fixture, read_manifest

          config = load_config()
          manifest = read_manifest()
          regenerated = build_fixture(config).log.content_hash()
          print(f"committed {manifest['log_content_hash'][:16]}")
          print(f"regenerated {regenerated[:16]}")
          assert regenerated == manifest["log_content_hash"], (
              "the committed log does not match what the seed regenerates"
          )
          PY

      - name: Tests, for the count and the coverage the receipts quote
        run: |
          mkdir -p reports
          python -m pytest -q \
            --junitxml=reports/junit.xml \
            --cov=replay_gap \
            --cov-report=json:reports/coverage.json \
            --cov-report=xml:reports/coverage.xml

      - name: Re-run every experiment from scratch
        run: python tools/run_experiments.py

      - name: Re-measure every published figure
        run: python tools/collect_metrics.py --skip-tests

      - name: Fail if any document has drifted from the measurements
        run: python tools/check_numbers.py --strict-reverse

      - name: Fail if any absolute duration is published as a claim
        run: python tools/check_durations.py

      - name: Prove the checker still fails when it should
        run: |
          bash tools/prove_receipts.sh > /tmp/receipts-proof.md
          diff -u docs/receipts-proof.md /tmp/receipts-proof.md || {
            echo "::error::docs/receipts-proof.md is stale; rerun tools/prove_receipts.sh"
            exit 1
          }

      - name: Publish the uncomfortable table to the job summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          metrics = json.loads(Path("docs/metrics.json").read_text(encoding="utf-8"))
          formatted = metrics["formatted"]
          described = metrics["descriptions"]

          print("## The numbers this build would rather not publish\n")
          print("| figure | value | what it is |")
          print("| --- | ---: | --- |")
          for key in (
              "incumbent_naive_lift",
              "e1_naive_sign_disagreement_rate",
              "e1_worst_true_lift",
              "e1_worst_naive_lift",
              "clone_true_lift",
              "clone_snips_lift",
              "sharp_ess_fraction",
              "e3_serving_true_gap",
              "e5_ess_at_crossover",
              "e4_worst_detectable",
          ):
              print(f"| `{key}` | {formatted[key]} | {described[key]} |")
          print(
              f"\n{formatted['tests_total']} tests at {formatted['coverage_line_pct']} line "
              "coverage. Every figure above was re-measured by this job.\n"
          )
          PY

      - name: Upload the experiment JSON and the metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipts
          path: |
            docs/experiments/
            docs/metrics.json
            reports/
          retention-days: 14

  # The PostgreSQL job is what stops the dialect claim from being theoretical. It is allowed to
  # be skipped where no service container is available, and ADR-003 says so rather than implying
  # both engines are exercised everywhere.
  postgres-parity:
    name: PostgreSQL dialect parity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: replaygap
          POSTGRES_DB: replaygap
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package with the postgres extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      - name: Run every committed PostgreSQL query against a real server
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: replaygap
          PGDATABASE: replaygap
        run: python -m pytest -q -m postgres --no-cov

  # The README's own rendering. A broken image reports nothing in any console, so the first
  # person to notice one is a reviewer looking at the repository.
  rendering:
    name: README renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package with the evidence extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,evidence]"
          python -m playwright install --with-deps chromium

      - name: Render the README with cmark-gfm and check every image resolves
        run: python tools/check_rendering.py

  # A reviewer following only the README, in a fresh directory, with no network. This is the
  # one promise the README makes that cannot be checked by any other job.
  clone-and-verify:
    name: clone, run, verify
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exactly what the README says to install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run exactly what the README says to run
        run: |
          replay-gap evaluate incumbent --no-ranker || test $? -eq 1
          make verify
