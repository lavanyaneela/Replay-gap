[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replay-gap"
version = "1.0.0"
description = "Offline ranker evaluation that reports when it cannot answer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lavanya Neela", email = "lavanyaneela@mycvcareer.com" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "duckdb>=0.10",
    "lightgbm>=4.0",
    "mlflow>=2.9",
    "pyarrow>=14.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "sqlglot>=20.0",
]
postgres = ["psycopg[binary]>=3.1"]
evidence = ["playwright>=1.40", "cmarkgfm>=2024.1.14"]

[project.scripts]
replay-gap = "replay_gap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
replay_gap = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "N"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["replay_gap"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that train a model or sweep a grid",
    "postgres: tests that need a live PostgreSQL server (optional CI job only)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = false
source = ["src/replay_gap"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
